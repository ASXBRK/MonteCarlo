<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monte Carlo Investment Projection</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <h1>Monte Carlo Investment Projection</h1>
        <p class="subtitle">
          2,000 simulated futures vs. a steady, "stagnant return" projection.
        </p>
      </header>

      <section class="controls-wrap">
        <div class="controls-topbar">
          <label class="toggle">
            <input id="compareToggle" type="checkbox" />
            <span>Compare scenarios</span>
          </label>
        </div>
        <div id="scenarios" class="scenarios single"></div>
      </section>

      <section class="chart-wrap">
        <div id="chart"></div>
      </section>

      <section id="compareExtras" class="compare-extras" hidden>
        <div id="callout" class="callout"></div>
        <div class="chart-wrap chart-wrap-small">
          <div id="probChart"></div>
        </div>
        <div id="narrative" class="narrative"></div>
      </section>

      <section id="summary" class="summary" aria-live="polite"></section>

      <footer class="app-footer">
        <p>
          Educational tool only. Returns are illustrative; past performance is not
          a forecast. No fees, taxes, or inflation modelled.
        </p>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
